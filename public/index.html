<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Karki AI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
  :root {
    --bg: #212121;
    --panel: #2a2a2a;
    --input: #303030;
    --border: #3c3c3c;
    --text: #ececec;
    --muted: #9a9a9a;
    --user: #343434;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: .3px; }
  .logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: #fff; color: #111;
    display: grid; place-items: center;
    font-weight: 800; font-size: 18px;
  }
  #newChat {
    background: transparent; color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 7px 12px; font-size: 14px; cursor: pointer;
  }
  #newChat:hover { background: var(--panel); }

  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 8px; }

  .welcome { text-align: center; margin-top: 12vh; }
  .welcome .big {
    width: 68px; height: 68px; margin: 0 auto 16px; border-radius: 18px;
    background: #fff; color: #111;
    display: grid; place-items: center; font-size: 36px; font-weight: 800;
  }
  .welcome h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  .welcome p { color: var(--muted); margin-bottom: 22px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 9px 14px; border-radius: 999px; font-size: 14px; cursor: pointer;
  }
  .chip:hover { border-color: #777; }

  .row { display: flex; margin-bottom: 22px; gap: 12px; }
  .row.user { justify-content: flex-end; }
  .bubble { line-height: 1.65; font-size: 15.5px; word-wrap: break-word; overflow-wrap: anywhere; }
  .row.user .bubble {
    background: var(--user); padding: 10px 16px; border-radius: 20px; max-width: 85%;
    white-space: pre-wrap;
  }
  .row.bot .avatar {
    flex: none; width: 28px; height: 28px; border-radius: 8px; margin-top: 2px;
    background: #fff; color: #111; font-weight: 800; font-size: 15px;
    display: grid; place-items: center;
  }
  .row.bot .bubble { flex: 1; min-width: 0; white-space: pre-wrap; }

  .bubble code.inline {
    background: #111; padding: 2px 6px; border-radius: 6px; font-size: 13.5px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .codeblock { background: #111; border: 1px solid var(--border); border-radius: 12px; margin: 10px 0; overflow: hidden; white-space: normal; }
  .codehead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 12px; background: #1a1a1a; font-size: 12px; color: var(--muted);
  }
  .copy { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; }
  .copy:hover { color: var(--text); }
  .codeblock pre {
    padding: 12px; overflow-x: auto; white-space: pre;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13.5px; line-height: 1.5;
  }

  .typing span {
    display: inline-block; width: 7px; height: 7px; margin-right: 4px;
    background: var(--muted); border-radius: 50%; animation: b 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }

  footer { padding: 8px 16px calc(14px + env(safe-area-inset-bottom)); }
  .composer {
    max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    background: var(--input); border: 1px solid var(--border);
    border-radius: 24px; padding: 8px 8px 8px 18px;
  }
  .composer:focus-within { border-color: #666; }
  textarea {
    flex: 1; background: transparent; border: none; outline: none; resize: none;
    color: var(--text); font: inherit; font-size: 16px; line-height: 1.5;
    max-height: 180px; padding: 6px 0;
  }
  textarea::placeholder { color: var(--muted); }
  #send {
    flex: none; width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--text); color: #111; font-size: 18px; font-weight: bold;
  }
  #send:disabled { opacity: .3; cursor: not-allowed; }
  .note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }

  @media (max-width: 600px) {
    .welcome { margin-top: 6vh; }
    .welcome h1 { font-size: 24px; }
    .row.user .bubble { max-width: 92%; }
  }
</style>
</head>
<body>

<header>
  <div class="brand"><div class="logo">K</div><span>Karki AI</span></div>
  <button id="newChat">+ New chat</button>
</header>

<main id="main">
  <div class="wrap" id="chat">
    <div class="welcome" id="welcome">
      <div class="big">K</div>
      <h1>Karki AI</h1>
      <p>Ask me anything. I'm here to help.</p>
      <div class="chips">
        <button class="chip">Explain AI in simple words</button>
        <button class="chip">Write a short poem</button>
        <button class="chip">Help me learn coding</button>
        <button class="chip">Give me a fun fact</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message Karki AI..."></textarea>
    <button id="send" disabled title="Send">↑</button>
  </div>
  <div class="note">Karki AI can make mistakes. Check important info.</div>
</footer>

<script>
  // ====== CHANGE THESE ======
  const AI_NAME = "Karki AI";
  const SYSTEM_PROMPT =
    "You are Karki AI, a smart, friendly and helpful AI assistant. " +
    "Your name is Karki AI, but do not introduce yourself unless the user asks who you are. " +
    "Never repeat your name or greeting at the start of every sentence or paragraph. " +
    "Answer the user directly and naturally, without repetitive introductions or filler. " +
    "Answer clearly and correctly. Keep replies concise unless the user asks for detail. Use simple language.";
  // ==========================

  const chatEl = document.getElementById("chat");
  const mainEl = document.getElementById("main");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  let history = [];
  let busy = false;

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(s) {
    return esc(s)
      .replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/^#{1,4}\s*(.+)$/gm, "<strong>$1</strong>")
      .replace(/^\s*[-*]\s+/gm, "• ");
  }

  function render(text) {
    return text.split("```").map((part, i) => {
      if (i % 2 === 0) return inline(part);
      const nl = part.indexOf("\n");
      let lang = "code", code = part;
      if (nl !== -1 && nl < 20) { lang = part.slice(0, nl).trim() || "code"; code = part.slice(nl + 1); }
      return '<div class="codeblock"><div class="codehead"><span>' + esc(lang) +
        '</span><button class="copy">Copy</button></div><pre>' + esc(code.replace(/\n$/, "")) + "</pre></div>";
    }).join("");
  }

  function scrollDown() { mainEl.scrollTop = mainEl.scrollHeight; }

  function addUser(text) {
    const r = document.createElement("div");
    r.className = "row user";
    r.innerHTML = '<div class="bubble"></div>';
    r.firstChild.textContent = text;
    chatEl.appendChild(r);
    scrollDown();
  }

  function addBot() {
    const r = document.createElement("div");
    r.className = "row bot";
    r.innerHTML = '<div class="avatar">K</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chatEl.appendChild(r);
    scrollDown();
    return r.querySelector(".bubble");
  }

  async function ask(text) {
    if (busy || !text.trim()) return;
    busy = true;
    sendBtn.disabled = true;
    const w = document.getElementById("welcome");
    if (w) w.remove();

    addUser(text);
    history.push({ role: "user", content: text });
    input.value = "";
    input.style.height = "auto";

    const bubble = addBot();
    let full = "";
    try {
      const messages = [{ role: "system", content: SYSTEM_PROMPT }, ...history.slice(-20)];
      const resp = await puter.ai.chat(messages, { stream: true });
      for await (const part of resp) {
        if (part && part.text) {
          full += part.text;
          bubble.innerHTML = render(full);
          scrollDown();
        }
      }
      if (!full) throw new Error("empty");
      history.push({ role: "assistant", content: full });
    } catch (e) {
      bubble.textContent = "Sorry, something went wrong. Please sign in to Puter if asked, then try again.";
      history.pop();
    }
    busy = false;
    sendBtn.disabled = !input.value.trim();
    input.focus();
  }

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
    sendBtn.disabled = busy || !input.value.trim();
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) {
      e.preventDefault();
      ask(input.value);
    }
  });

  sendBtn.onclick = () => ask(input.value);
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => ask(c.textContent));
  document.getElementById("newChat").onclick = () => location.reload();

  chatEl.addEventListener("click", (e) => {
    if (e.target.classList.contains("copy")) {
      const code = e.target.closest(".codeblock").querySelector("pre").textContent;
      navigator.clipboard.writeText(code);
      e.target.textContent = "Copied!";
      setTimeout(() => (e.target.textContent = "Copy"), 1500);
    }
  });
</script>
</body>
</html>
