<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Karki AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090d;--panel:#080b10;--glass:rgba(255,255,255,.05);--line:rgba(255,255,255,.09);--tx:#f1f3f8;--mut:#8a93a6;--a1:#1299dc;--a2:#2563eb;--g:linear-gradient(135deg,var(--a1),var(--a2));--ac:var(--a1);--code:#05070a;--p1:#237d92;--p2:#0e3c50;--l1:#8fd3e3;--l2:#cfe9f2;--o1:#3b2bd9;--o2:#e11d9a;--o3:#ff8a1f;--o4:#22d3ee;--pg:radial-gradient(110% 55% at 50% 118%,var(--p1) 0%,var(--p2) 38%,transparent 72%)}
:root[data-c=aurora]{--a1:#8b5cf6;--a2:#ec4899;--p1:#7c3aed;--p2:#3b1068;--l1:#d8b4fe;--l2:#f3e8ff;--o1:#4f46e5;--o2:#ec4899;--o3:#a855f7;--o4:#22d3ee}
:root[data-c=sunset]{--a1:#f97316;--a2:#e11d48;--p1:#c2410c;--p2:#5a1a1a;--l1:#fdba74;--l2:#ffedd5;--o1:#f59e0b;--o2:#e11d48;--o3:#7c3aed;--o4:#fb7185}
:root[data-c=emerald]{--a1:#10b981;--a2:#0ea5e9;--p1:#0f9d7a;--p2:#0b3b36;--l1:#86efac;--l2:#dcfce7;--o1:#059669;--o2:#22d3ee;--o3:#a3e635;--o4:#0ea5e9}
:root[data-c=midnight]{--a1:#6366f1;--a2:#06b6d4;--p1:#4338ca;--p2:#1e1b4b;--l1:#a5b4fc;--l2:#e0e7ff;--o1:#6366f1;--o2:#06b6d4;--o3:#8b5cf6;--o4:#38bdf8}
:root[data-t=light]{--bg:#eef3f7;--panel:#fff;--glass:rgba(10,30,50,.05);--line:rgba(10,30,50,.1);--tx:#0f172a;--mut:#5b6678;--code:#eef1f5;--pg:radial-gradient(110% 55% at 50% 118%,var(--l1) 0%,var(--l2) 45%,transparent 75%)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--pg),var(--bg);color:var(--tx);overflow:hidden;font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:flex;height:100dvh;padding-top:env(safe-area-inset-top)}
.rail{width:84px;flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0;z-index:35}
.wm{font-weight:700;font-size:15px;line-height:1.15;text-align:center;width:54px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.rb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:.15s}
.rb:hover{border-color:var(--ac)}.rb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sp{flex:1}
aside{position:fixed;left:84px;top:0;bottom:0;width:280px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 12px 16px;gap:10px;z-index:30;transform:translateX(-130%);transition:transform .25s}
aside.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.45)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;padding:4px 6px}
.orb{width:28px;height:28px;border-radius:50%;flex:none;background:conic-gradient(from 200deg,var(--o1),var(--o2),var(--o3),var(--o4),var(--o1));box-shadow:0 0 18px color-mix(in srgb,var(--o4) 45%,transparent)}
.orb.think{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass);min-height:44px}
.btn.p{background:var(--g);border:0;color:#fff;font-weight:600}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}
.it{display:flex;align-items:center;border-radius:10px;padding:0 4px 0 12px;min-height:42px;cursor:pointer;color:var(--mut)}
.it.on,.it:hover{background:var(--glass);color:var(--tx)}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it button{padding:8px;color:var(--mut)}
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
main.empty{justify-content:center;overflow:auto;padding-bottom:20px}
.ic{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--mut)}
#chat{flex:1;overflow:auto;scroll-behavior:smooth;padding:20px 14px 170px}
main.empty #chat{flex:none;overflow:visible;padding:0 14px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.hero{text-align:center;padding:2vh 0 18px}
.big{width:clamp(120px,22vh,190px);aspect-ratio:1;margin:0 auto 22px;border-radius:50%;position:relative;overflow:hidden;background:#05060a;box-shadow:0 0 0 5px #000,0 0 70px color-mix(in srgb,var(--o4) 35%,transparent)}
.big::before{content:"";position:absolute;inset:-35%;background:conic-gradient(#0b1020,var(--o1),var(--o2),var(--o3),var(--o4),#0b1020,var(--o1),#0b1020);filter:blur(20px);animation:spin 14s linear infinite}
.big::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.28),transparent 34%),radial-gradient(circle at 50% 62%,transparent 18%,rgba(0,0,0,.7) 88%)}
.hero h2{font-size:clamp(28px,6vw,40px);font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-bottom:10px}
.mu{color:var(--mut);opacity:.75}.hero p{color:var(--mut);max-width:340px;margin:0 auto}
.m{display:flex;gap:10px;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.m.u{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700}
.m.a .av{background:var(--g);color:#fff}.m.u .av{background:var(--glass);border:1px solid var(--line)}
.bub{max-width:calc(100% - 44px);min-width:0}
.m.u .bub{background:var(--g);color:#fff;padding:10px 15px;border-radius:18px 18px 4px 18px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.a .bub{background:var(--glass);border:1px solid var(--line);padding:12px 16px;border-radius:18px 18px 18px 4px;backdrop-filter:blur(10px)}
.md>*+*{margin-top:.65em}.md h1,.md h2,.md h3{line-height:1.3}.md ul,.md ol{padding-left:1.3em}
.md a{color:var(--ac)}.md code{background:var(--code);padding:2px 6px;border-radius:6px;font-size:.88em}
.md img{max-width:100%;border-radius:12px;display:block}
.md pre{background:var(--code);border:1px solid var(--line);border-radius:12px;overflow:auto;position:relative;padding:14px}
.md pre code{padding:0;background:none}
.cp{position:absolute;top:6px;right:6px;font-size:12px;padding:4px 9px;border-radius:8px;background:var(--glass);color:var(--mut)}
.md table{border-collapse:collapse;display:block;overflow:auto}.md td,.md th{border:1px solid var(--line);padding:6px 10px}
.acts{display:flex;gap:2px;margin-top:8px;margin-left:-8px}
.acts button{padding:7px;border-radius:8px;color:var(--mut)}.acts button:hover{background:var(--glass);color:var(--tx)}.acts svg{width:16px;height:16px}
.dots{display:flex;gap:5px;padding:6px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--ac);animation:d 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes d{50%{opacity:.25;transform:translateY(-4px)}}
.bar{position:absolute;left:0;right:0;bottom:0;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
main.empty .bar{position:static;padding:0 14px}
.outer{max-width:640px;margin:0 auto;background:color-mix(in srgb,var(--p2) 82%,#000);border:1px solid color-mix(in srgb,var(--ac) 28%,transparent);border-radius:26px;padding:6px;backdrop-filter:blur(14px)}
:root[data-t=light] .outer{background:rgba(255,255,255,.7)}
.strip{font-size:13px;padding:6px 12px 8px;display:flex;align-items:center;gap:6px;color:var(--tx)}.strip svg{width:14px;height:14px}
.box{background:var(--panel);border-radius:20px;padding:12px 14px 10px}
.box:focus-within{box-shadow:0 0 0 1px var(--ac)}
textarea{width:100%;display:block;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:16px;resize:none;max-height:150px;line-height:1.5;min-height:28px}
.row{display:flex;align-items:center;gap:8px;margin-top:8px}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;display:flex;gap:6px;align-items:center;min-height:36px}
.pill svg{width:15px;height:15px}.pill:hover{border-color:var(--ac)}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mut);border:1px solid var(--line)}
.ib.send{background:var(--ac);border-color:var(--ac);color:#fff}
.rec{background:rgba(239,68,68,.2);color:#f87171;animation:pulse 1s infinite}
#cards{display:none;grid-template-columns:repeat(3,1fr);gap:12px;max-width:640px;margin:14px auto 0;padding:0 14px;width:100%}
main.empty #cards{display:grid}
.cd{text-align:left;padding:14px;border-radius:16px;background:color-mix(in srgb,var(--p1) 22%,transparent);border:1px solid color-mix(in srgb,var(--ac) 18%,transparent);color:var(--mut);font-size:13px;line-height:1.45;transition:.15s}
.cd:hover{border-color:var(--ac);transform:translateY(-2px)}
.cd b{display:flex;gap:7px;align-items:center;color:var(--tx);font-weight:500;font-size:15px;margin-bottom:4px}
#down{position:absolute;right:18px;bottom:130px;display:none;background:var(--panel);border:1px solid var(--line);border-radius:50%}
.ov{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--ac) 25%,transparent),var(--bg) 70%);padding:24px;text-align:center}
.ov.on{display:flex}.ov .orb{width:150px;height:150px;box-shadow:0 0 70px color-mix(in srgb,var(--o4) 55%,transparent)}
.ov .orb.listen{animation:pulse 1.2s infinite}.ov .orb.speak{animation:pulse .6s infinite}
#vtx{color:var(--mut);max-width:520px;min-height:48px}
.set{align-items:stretch;justify-content:center;text-align:left}
.card{max-height:92dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:420px;width:100%;margin:auto;display:flex;flex-direction:column;gap:14px}
.card label{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--mut);font-size:14px}
.card select,.card input[type=range]{background:var(--glass);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px;max-width:190px}
.sw{display:flex;gap:9px}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--panel)}.sw button.on{border-color:var(--tx)}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:9px 16px;border-radius:12px;z-index:90;font-size:14px}
@media(max-width:820px){.app{flex-direction:column}.rail{flex-direction:row;width:100%;height:58px;padding:6px 12px;gap:8px}.wm{border:0;padding:0;margin:0 auto 0 0;width:auto;font-size:18px}.rb{width:40px;height:40px}.sp{display:none}aside{left:0;top:calc(58px + env(safe-area-inset-top));padding-top:16px;width:84%;max-width:300px}#cards{grid-template-columns:1fr;gap:8px}.cd{padding:11px 14px}}
.hero{padding:2vh 0 28px}.hero p{max-width:380px}
#cards{margin-top:22px;gap:14px}.cd{padding:16px}.box{padding:14px 16px 12px}
.ib#vm2{color:var(--ac);border-color:var(--ac)}
@media(max-width:820px){
.rail{height:56px;padding:6px 14px}.wm{font-size:19px}
#vmode,#theme,.hm,.strip,.lb{display:none}
.hero{padding:0 0 22px}.big{width:108px;margin-bottom:18px}.hero h2{font-size:27px}.hero p{font-size:14px}
.outer{padding:0;background:none;border:0;backdrop-filter:none}
.box{border:1px solid var(--line);border-radius:26px;background:rgba(8,12,18,.92);padding:14px 16px 10px}
:root[data-t=light] .box{background:#fff}
main.empty #cards{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.cd{border-radius:999px;padding:9px 15px}.cd .ds{display:none}.cd b{margin:0;font-size:14px}
.pill{padding:0;width:40px;height:40px;justify-content:center}
.row{gap:8px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Deep Space direction — Karki AI */
:root{--bg:#050914;--panel:#091326;--glass:rgba(91,145,220,.075);--line:rgba(113,163,230,.15);--tx:#edf5ff;--mut:#91a6c5;--a1:#38bdf8;--a2:#4169e1;--ac:#45c8ff;--p1:#102b50;--p2:#08172e;--code:#050c19;--pg:radial-gradient(70% 45% at 50% 105%,#102c55 0%,#08152b 48%,transparent 82%)}
body{background:radial-gradient(ellipse at 50% 45%,rgba(17,48,91,.24),transparent 58%),var(--pg),var(--bg)}

  <label style="flex-direction:column;align-items:stretch;gap:6px">Free AI key (optional, most reliable)<input id="key" type="password" placeholder="Paste Gemini or Groq key" autocomplete="off" style="background:var(--glass);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;max-width:none"><small>Get one free at aistudio.google.com/apikey. It stays only on this device, never in the site code.</small></label>
  <button class="btn" id="theme2">Switch light / dark theme</button>
  <button class="btn" id="exp">Export this chat (.txt)</button>
  <button class="btn" id="clr" style="color:#f87171">Delete all data</button>
  <button class="btn p" id="sx">Done</button>
</div></div>

<script>
/* ============ CONFIG ============ */
const CONFIG={
  post:"https://text.pollinations.ai/openai", model:"openai-fast",
  get:"https://text.pollinations.ai/",
  system:"You are Karki AI, a capable, thoughtful, warm, conversational general-purpose assistant. Respond naturally and directly, like a polished modern AI chat assistant. Understand English, Nepali (Devanagari), and romanized Nepali; reply in the same language and script the user uses unless they ask otherwise. Give complete, useful answers with clear reasoning and practical examples when helpful. Match the requested level of detail: concise for simple questions, structured and thorough for complex ones. Use clean Markdown with short paragraphs, meaningful headings, bullets, numbered steps, and fenced code blocks when useful; do not over-format ordinary replies. For coding, provide working code and explain exactly where it goes when relevant. For factual questions, distinguish known facts from uncertainty, never fabricate sources or details, and say when you are unsure. Ask one focused clarification only when essential. Be friendly without being overly enthusiastic, repetitive, or robotic. Never claim to have performed actions you did not perform. Follow safety requirements.",
  ctx:10
};
/* ============ STATE & STORAGE ============ */
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
let chats=ld("nova_chats",[]),cur=null,busy=false,ctl=null;
let S=Object.assign({theme:"dark",accent:"ocean",lang:"en-US",rate:1,pitch:1,auto:false},ld("nova_set",{}));
const save=()=>{sv("nova_chats",chats);sv("nova_set",S)};
const chat=()=>chats.find(c=>c.id===cur);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1800)}

/* ============ MARKDOWN ============ */
function md(src){
  const blocks=[];
  src=src.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{blocks.push(`<pre><button class="cp">Copy</button><code>${esc(c.replace(/\n$/,""))}</code></pre>`);return`\u0000${blocks.length-1}\u0000`});
  const inl=t=>esc(t).replace(/!\[([^\]]*)\]\((https:[^)\s]+)\)/g,'<img alt="$1" src="$2" loading="lazy">').replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|\W)\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  let out="",list=null,tbl=[];
  const endL=()=>{if(list){out+=`</${list}>`;list=null}};
  const endT=()=>{if(tbl.length){const r=tbl.filter(x=>!/^\|?[\s:|-]+\|?$/.test(x)).map(x=>x.replace(/^\||\|$/g,"").split("|"));out+="<table>"+r.map((c,i)=>"<tr>"+c.map(x=>`<${i?"td":"th"}>${inl(x.trim())}</${i?"td":"th"}>`).join("")+"</tr>").join("")+"</table>";tbl=[]}};
  for(const ln of src.split("\n")){
    let m;
    if(/^\s*\|.*\|\s*$/.test(ln)){endL();tbl.push(ln);continue}else endT();
    if(m=ln.match(/^(#{1,3})\s+(.*)/)){endL();out+=`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`}
    else if(m=ln.match(/^\s*[-*]\s+(.*)/)){if(list!=="ul"){endL();out+="<ul>";list="ul"}out+=`<li>${inl(m[1])}</li>`}
    else if(m=ln.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=="ol"){endL();out+="<ol>";list="ol"}out+=`<li>${inl(m[1])}</li>`}
    else if(ln.trim()===""){endL()}
    else if(/^\u0000\d+\u0000$/.test(ln.trim())){endL();out+=ln.trim()}
    else{endL();out+=`<p>${inl(ln)}</p>`}
  }
  endL();endT();
  return out.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
}

/* ============ UI ============ */
const I={cp:'<path d="M9 9h11v11H9zM5 15V5h10"/>',rg:'<path d="M3 12a9 9 0 0115-6.7L21 8M21 3v5h-5M21 12a9 9 0 01-15 6.7L3 16M3 21v-5h5"/>',sp:'<path d="M11 5L6 9H3v6h3l5 4zM16 8a5 5 0 010 8"/>'};
const ico=p=>`<svg viewBox="0 0 24 24">${p}</svg>`;
const SUG=[["Explain something","How does a black hole work, simply?"],["Write code","Write a Python script to rename files in a folder"],["Plan my day","Make a productive study plan for 3 hours"],["Surprise me","Tell me a fascinating fact I probably don't know"]];
function renderList(){
  $("#list").innerHTML="";
  chats.slice().reverse().forEach(c=>{
    const d=document.createElement("div");d.className="it"+(c.id===cur?" on":"");
    d.innerHTML=`<span>${esc(c.title)}</span><button aria-label="Rename">${ico('<path d="M4 20h4L19 9l-4-4L4 16z"/>')}</button><button aria-label="Delete">${ico('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>')}</button>`;
    d.onclick=e=>{const b=e.target.closest("button");
      if(b){e.stopPropagation();
        if(b.getAttribute("aria-label")==="Delete"){chats=chats.filter(x=>x.id!==c.id);if(cur===c.id)cur=null;save();show()}
        else{const n=prompt("Rename chat",c.title);if(n){c.title=n.slice(0,60);save();renderList();$("#title").textContent=chat()?.title||"New chat"}}
        return}
      cur=c.id;show();$("#side").classList.remove("open")};
    $("#list").append(d)});
}
function msgEl(m,i){
  const d=document.createElement("div");d.className="m "+(m.r==="user"?"u":"a");
  d.innerHTML=`<div class="av">${m.r==="user"?"You":"K"}</div><div class="bub"></div>`;
  const b=d.querySelector(".bub");
  if(m.r==="user")b.textContent=m.t;
  else{b.innerHTML=`<div class="md">${md(m.t)}</div><div class="acts"><button data-a="cp" aria-label="Copy">${ico(I.cp)}</button><button data-a="rg" aria-label="Regenerate">${ico(I.rg)}</button><button data-a="sp" aria-label="Read aloud">${ico(I.sp)}</button></div>`;
    b.querySelector(".acts").onclick=e=>{const a=e.target.closest("button")?.dataset.a;
      if(a==="cp"){navigator.clipboard?.writeText(m.t);toast("Copied")}
      if(a==="rg")regen();if(a==="sp")speak(m.t)}}
  return d;
}
function show(){
  renderList();const c=chat(),box=$("#msgs");box.innerHTML="";
  $("#title").textContent=c?.title||"New chat";
  const empty=!c||!c.msgs.length;$("main").classList.toggle("empty",empty);
  if(empty)box.innerHTML='<div class="hero"><div class="big"><span class="core-label">Karki AI</span></div><h2>How can I help today?</h2><p>Your intelligent space. Ask anything, create anything.</p></div>';
  else c.msgs.forEach((m,i)=>box.append(msgEl(m,i)));
  bottom(true);
}
const ch=$("#chat");
function bottom(f){if(f||ch.scrollHeight-ch.scrollTop-ch.clientHeight<200)ch.scrollTop=ch.scrollHeight}
ch.onscroll=()=>{$("#down").style.display=ch.scrollHeight-ch.scrollTop-ch.clientHeight>300?"grid":"none"};
$("#down").onclick=()=>ch.scrollTo({top:ch.scrollHeight});
$("#msgs").addEventListener("click",e=>{if(e.target.classList.contains("cp")){navigator.clipboard?.writeText(e.target.nextElementSibling.textContent);e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy",1200)}});
const inp=$("#in");
inp.oninput=()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,160)+"px"};
inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send()}};
document.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();newChat()}};
function newChat(){cur=null;show();inp.focus();$("#side").classList.remove("open")}
$("#new").onclick=newChat;$("#menu").onclick=()=>$("#side").classList.toggle("open");
function setAccent(c){S.accent=c;document.documentElement.dataset.c=c;document.querySelectorAll(".sw button").forEach(b=>b.classList.toggle("on",b.dataset.c===c));save()}
document.querySelectorAll(".sw button").forEach(b=>b.onclick=()=>setAccent(b.dataset.c));
function setTheme(t){S.theme=t;document.documentElement.dataset.t=t;document.querySelector('meta[name=theme-color]').content=t==="dark"?"#0b0d12":"#f6f7fb";save()}
$("#theme").onclick=()=>setTheme(S.theme==="dark"?"light":"dark");
$("#exp").onclick=()=>{const c=chat();if(!c)return toast("Nothing to export");
  const t=c.msgs.map(m=>(m.r==="user"?"You: ":"Karki AI: ")+m.t).join("\n\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download=c.title+".txt";a.click()};

/* ============ AI ============ */
const FACT=/\b(who|what|when|where|which|why|how (many|much|old|tall|far|long)|capital|president|prime minister|population|history|define|meaning of|tell me about|explain)\b|\?\s*$|(को हो|के हो|कहाँ|कहिले|कति|किन|बारे|को बारेमा|कसरी)|\b(ko ho|ke ho|kaha|kahile|kati|barema)\b/i;
const SKIP=/\b(code|script|write|poem|story|translate|essay|email|joke|plan|draw|image|picture|summari[sz]e|rewrite|my )\b|^file:|^(hi|hello|hey|namaste)\b/i;
async function wiki(q,force){
  q=q.trim();if(q.length<3||(!force&&(q.length<8||q.split(/\s+/).length<3||SKIP.test(q)||!FACT.test(q))))return null;
  const lang=/[\u0900-\u097F]/.test(q)?"ne":"en";
  const term=q.replace(/\b(who|what|when|where|which|why|how|is|are|was|were|the|a|an|of|tell|me|about|explain|define|meaning|does|do|did|in|to)\b|[?!.,]/gi," ").replace(/\s+/g," ").trim().slice(0,100);
  if(!term)return null;
  const u="https://"+lang+".wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(term)+"&gsrlimit=1&prop=extracts|info&exintro=1&explaintext=1&exchars=1500&inprop=url&format=json&origin=*";
  const r=await Promise.race([fetch(u),new Promise((_,j)=>setTimeout(()=>j(0),4500))]);
  if(!r.ok)return null;const j=await r.json();const p=j.query&&Object.values(j.query.pages)[0];
  if(!p||!p.extract||p.extract.length<60)return null;
  return{text:p.title+": "+p.extract,url:p.fullurl};
}
function offline(q){
  const s=q.toLowerCase().trim(),n=new Date();
  if(/^(hi|hello|hey|namaste|नमस्ते)/.test(s))return"Hello! नमस्ते! I'm Karki AI. I can't reach the network right now, but I'm here.";
  if(/time/.test(s))return"It's "+n.toLocaleTimeString()+".";
  if(/date|today|day/.test(s))return"Today is "+n.toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})+".";
  const m=s.replace(/[x×]/g,"*").replace(/÷/g,"/").match(/^[\d\s+\-*/().%^]+$/);
  if(m)try{return"= **"+Function('"use strict";return('+s.replace(/[x×]/g,"*").replace(/\^/g,"**")+")")()+"**"}catch{}
  return"I can't reach the AI service right now, so I can only handle greetings, the time, the date and simple math.";
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function tf(url,opt,signal){const ab=new Promise((_,j)=>signal.addEventListener("abort",()=>j(new Error("stopped"))));const r=await Promise.race([fetch(url,opt),ab]);if(r.status===429)throw new Error("busy (rate limit)");if(!r.ok)throw new Error("HTTP "+r.status);return r}
async function ask(msgs,signal,status){
  const hist=msgs.slice(-CONFIG.ctx);
  const body=[{role:"system",content:CONFIG.system},...hist.map(m=>({role:m.r==="user"?"user":"assistant",content:m.t}))];
  const key=(S.key||"").trim();
  const timedFetch=async(url,opt={},timeoutMs=60000)=>{
    const controller=new AbortController(),stop=()=>controller.abort();
    signal.addEventListener("abort",stop,{once:true});
    const timer=setTimeout(()=>controller.abort(),timeoutMs);
    try{const r=await fetch(url,{...opt,signal:controller.signal});if(r.status===429)throw new Error("busy (rate limit)");if(!r.ok)throw new Error("HTTP "+r.status);return r}
    finally{clearTimeout(timer);signal.removeEventListener("abort",stop)}
  };
  status("Connecting to Karki AI…");
  try{
    const r=await timedFetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:hist.map(m=>({role:m.r==="user"?"user":"assistant",content:m.t}))})},65000);
    const j=await r.json();
    if(!j.answer)throw new Error(j.error||"Karki AI server returned an empty answer");
    return j.answer.trim();
  }catch(e){
    if(signal.aborted)throw e;
    const latestQuestion=hist.filter(m=>m.r==="user").slice(-1)[0]?.t||"";
    if(FACT.test(latestQuestion))throw new Error("I couldn't reach Karki AI's live research server, so I won't guess about current facts. Please try again in a moment.");
    status("Trying backup AI service…");
  }
  const jobs=[];
  if(key.startsWith("AIza"))jobs.push((async()=>{
    const r=await timedFetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+encodeURIComponent(key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:CONFIG.system}]},contents:hist.map(h=>({role:h.r==="user"?"user":"model",parts:[{text:h.t}]}))})});
    const j=await r.json();return j.candidates?.[0]?.content?.parts?.map(p=>p.text).join("");
  })());
  else if(key.startsWith("gsk_"))jobs.push((async()=>{
    const r=await timedFetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+key},body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:body})});
    const j=await r.json();return j.choices?.[0]?.message?.content;
  })());
  jobs.push((async()=>{const r=await timedFetch(CONFIG.post,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:CONFIG.model,messages:body})});const j=await r.json();return j.choices?.[0]?.message?.content})());
  jobs.push((async()=>{const convo=hist.map(m=>(m.r==="user"?"User: ":"Assistant: ")+m.t).join("\n").slice(-700)+"\nAssistant:";const url=CONFIG.get+encodeURIComponent(convo)+"?model="+encodeURIComponent(CONFIG.model)+"&system="+encodeURIComponent(CONFIG.system);return(await timedFetch(url)).text()})());
  status("Connecting…");
  return await Promise.any(jobs.map(async job=>{const value=await job;if(!value||!value.trim())throw new Error("Empty reply");return value.trim()}));
}
async function reply(){
  const c=chat(),box=$("#msgs");busy=true;setBusy(true);
  const ph=document.createElement("div");ph.className="m a";ph.innerHTML='<div class="av">K</div><div class="bub"><div class="dots"><i></i><i></i><i></i></div></div>';
  box.append(ph);bottom(true);document.querySelector(".brand .orb").classList.add("think");
  ctl=new AbortController();
  let txt;
  try{txt=await ask(c.msgs.slice(),ctl.signal,t=>{ph.querySelector(".bub").innerHTML='<div class="dots"><i></i><i></i><i></i></div><small style="color:var(--mut)">'+t+'</small>'})}
  catch(e){if(ctl.signal.aborted){ph.remove();return end()}
    txt=offline(c.msgs[c.msgs.length-1].t)+"\n\n*Couldn't reach the AI service ("+(navigator.onLine?(e&&e.message||"unknown error"):"your device is offline")+". Please try again, or add a free Gemini key in Settings for more reliable answers.*"}
  ph.remove();c.msgs.push({r:"ai",t:txt});save();
  show();end();
  if(S.auto||voiceMode)speak(txt);
}
function end(){busy=false;setBusy(false);document.querySelector(".brand .orb").classList.remove("think")}
function setBusy(b){$("#send").innerHTML=b?ico('<rect x="6" y="6" width="12" height="12" rx="2"/>'):ico('<path d="M12 19V5m0 0l-6 6m6-6l6 6"/>')}
function regen(){if(busy)return;const c=chat();if(!c)return;while(c.msgs.length&&c.msgs[c.msgs.length-1].r==="ai")c.msgs.pop();show();reply()}
async function send(t){
  if(busy){ctl?.abort();speechSynthesis?.cancel();return}
  t=(t??inp.value).trim();if(!t)return;
  if(command(t))return;
  const im=t.match(/^(?:create|generate|draw|make)\s+(?:an?\s+)?(?:image|picture|photo)\s*(?:of|:)?\s*(.+)/i);
  let c=chat();if(!c){c={id:Date.now().toString(36),title:t.slice(0,40),msgs:[]};chats.push(c);cur=c.id}
  c.msgs.push({r:"user",t});save();inp.value="";inp.oninput();
  if(im){c.msgs.push({r:"ai",t:"Here you go:\n\n![image](https://image.pollinations.ai/prompt/"+encodeURIComponent(im[1].replace(/[()*_]/g,""))+"?width=768&height=768&nologo=true&seed="+(Date.now()%1e5)+")"});save();show();return}
  show();await reply();
}
$("#send").onclick=()=>send();

/* ============ VOICE ============ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,voiceMode=false,lastSpoken="";
function pickVoice(l){const v=speechSynthesis.getVoices();return v.find(x=>x.lang.replace("_","-")===l)||v.find(x=>x.lang.startsWith(l.slice(0,2)))}
function speak(t){
  if(!("speechSynthesis" in window))return toast("Speech output not supported");
  speechSynthesis.cancel();lastSpoken=t;
  const clean=t.replace(/```[\s\S]*?```/g," code block ").replace(/[*#`_>|-]/g,"");
  const u=new SpeechSynthesisUtterance(clean);const L=/[\u0900-\u097F]/.test(clean)&&!/^(hi|ne)/.test(S.lang)?"ne-NP":S.lang;u.lang=L;u.rate=S.rate;u.pitch=S.pitch;const v=pickVoice(L);if(v)u.voice=v;
  if(voiceMode){$("#vorb").className="orb speak";$("#vtx").textContent="Speaking… tap to interrupt";u.onend=()=>{if(voiceMode)listen()}}
  speechSynthesis.speak(u);
}
function command(t){
  const s=t.toLowerCase().replace(/[.!?]/g,"").trim();
  const map={"new chat":newChat,"clear chat":()=>{const c=chat();if(c){c.msgs=[];save();show()}},"dark mode":()=>setTheme("dark"),"light mode":()=>setTheme("light"),"stop":()=>{speechSynthesis.cancel();ctl?.abort()},"read that again":()=>lastSpoken&&speak(lastSpoken)};
  if(map[s]){map[s]();inp.value="";return true}return false;
}
function listen(onFinal){
  if(!SR){toast("Voice input isn't supported here. Try Chrome or Safari.");return false}
  try{rec?.abort()}catch{}
  rec=new SR();rec.lang=S.lang;rec.interimResults=true;rec.continuous=false;let fin="";
  rec.onstart=()=>{$("#mic").classList.add("rec");if(voiceMode){$("#vorb").className="orb listen";$("#vtx").textContent="Listening…"}};
  rec.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;fin=t;if(voiceMode)$("#vtx").textContent=t;else inp.value=t;inp.oninput()};
  rec.onerror=e=>{if(e.error==="not-allowed")toast("Microphone permission denied");if(voiceMode&&e.error!=="not-allowed"&&e.error!=="aborted")setTimeout(()=>voiceMode&&!busy&&listen(),600)};
  rec.onend=()=>{$("#mic").classList.remove("rec");if(fin.trim()){send(fin)}else if(voiceMode&&!busy&&!speechSynthesis.speaking)setTimeout(()=>voiceMode&&listen(),400)};
  try{rec.start();return true}catch{return false}
}
$("#mic").onclick=()=>{if($("#mic").classList.contains("rec"))rec.stop();else listen()};
$("#vmode").onclick=()=>{if(!SR||!("speechSynthesis" in window))return toast("Voice mode needs Chrome or Safari");voiceMode=true;$("#vo").classList.add("on");$("#vorb").className="orb";$("#vtx").textContent="Listening… speak naturally";listen()};
$("#vorb").onclick=()=>{if($("#mic").classList.contains("rec")){try{rec?.stop()}catch{};return}speechSynthesis.cancel();ctl?.abort();listen()};
$("#vx").onclick=()=>{voiceMode=false;try{rec?.abort()}catch{}speechSynthesis.cancel();$("#vo").classList.remove("on")};

/* ============ EXTRAS ============ */
const fi=document.createElement("input");fi.type="file";fi.accept=".txt,.md,.csv,.json,.js,.py,.html,.css,text/*";
$("#imp").onclick=()=>fi.click();
fi.onchange=()=>{const f=fi.files[0];if(!f)return;if(f.size>200000){fi.value="";return toast("File too big (max 200 KB)")}const r=new FileReader();r.onload=()=>{inp.value=(inp.value?inp.value+"\n\n":"")+"File: "+f.name+"\n"+String(r.result).slice(0,6000);inp.oninput();inp.focus()};r.readAsText(f);fi.value=""};
$("#vm2").onclick=()=>$("#vmode").click();
$("#theme2").onclick=()=>$("#theme").click();
$("#tools").onclick=()=>$("#setb").click();
document.querySelectorAll(".cd").forEach(b=>b.onclick=()=>{const k=b.dataset.c;
  if(k==="s")send("Surprise me with a creative idea or a short story.");
  else{inp.value=k==="i"?"Create an image of ":"Summarise this:\n";inp.oninput();inp.focus()}});
$("main").addEventListener("click",()=>$("#side").classList.remove("open"));
/* ============ SETTINGS ============ */
$("#setb").onclick=()=>{$("#lang").value=S.lang;$("#rate").value=S.rate;$("#pitch").value=S.pitch;$("#auto").checked=S.auto;$("#key").value=S.key||"";$("#so").classList.add("on")};
$("#sx").onclick=()=>{S.lang=$("#lang").value;S.rate=+$("#rate").value;S.pitch=+$("#pitch").value;S.auto=$("#auto").checked;S.key=$("#key").value.trim();save();$("#so").classList.remove("on")};
$("#clr").onclick=()=>{if(confirm("Delete all chats and settings?")){localStorage.removeItem("nova_chats");localStorage.removeItem("nova_set");location.reload()}};

/* ============ INIT ============ */
setTheme(S.theme);setAccent(S.accent);show();
</script>
</body>
</html>
